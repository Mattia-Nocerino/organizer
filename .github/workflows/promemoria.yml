name: Promemoria

on:
  schedule:
    # ogni 10 minuti, tutto il giorno: gli avvisi dell'agenda
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      prova:
        description: 'Manda una notifica di prova adesso'
        type: boolean
        default: true

concurrency: promemoria

jobs:
  avvisa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      # finché la chiave di Firebase non è nei Secrets del repo non c'è niente da fare
      - if: env.FIREBASE_SERVICE_ACCOUNT == ''
        run: echo "Manca il secret FIREBASE_SERVICE_ACCOUNT, nessuna notifica inviata"
      - if: env.FIREBASE_SERVICE_ACCOUNT != ''
        uses: actions/checkout@v4
      - if: env.FIREBASE_SERVICE_ACCOUNT != ''
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - if: env.FIREBASE_SERVICE_ACCOUNT != ''
        run: npm install --no-save --no-audit --no-fund firebase-admin@12.7.0
      - if: env.FIREBASE_SERVICE_ACCOUNT != ''
        run: node scripts/promemoria.mjs
        env:
          PROVA: ${{ inputs.prova && '1' || '0' }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
