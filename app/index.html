<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Organizer di casa</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#22564E">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Casa">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Young+Serif&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1EE; --surface:#FFFFFF; --ink:#1B2422; --muted:#5B6864; --line:#D3DBD7;
  --primary:#22564E; --primary-ink:#FFFFFF; --primary-soft:#D9E8E3;
  --soon:#8A5A0B; --soon-bg:#F7E8C6; --late:#A32D25; --late-bg:#F6DAD6; --ok:#2F6B4F;
  --serif:"Young Serif", Georgia, "Times New Roman", serif;
  --sans:"Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111816; --surface:#1A2320; --ink:#E5ECE9; --muted:#9AA9A4; --line:#2C3834;
    --primary:#86C9BA; --primary-ink:#0E1A17; --primary-soft:#21352F;
    --soon:#E8BC62; --soon-bg:#382C12; --late:#F2907F; --late-bg:#3B1E1A; --ok:#8FD0AE;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111816; --surface:#1A2320; --ink:#E5ECE9; --muted:#9AA9A4; --line:#2C3834;
  --primary:#86C9BA; --primary-ink:#0E1A17; --primary-soft:#21352F;
  --soon:#E8BC62; --soon-bg:#382C12; --late:#F2907F; --late-bg:#3B1E1A; --ok:#8FD0AE;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
.wrap{max-width:560px;margin:0 auto;padding:16px 18px calc(96px + env(safe-area-inset-bottom,0px))}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:4px 0 18px}
header.top h1{font-family:var(--serif);font-weight:400;font-size:1.25rem;margin:0;color:var(--primary)}
.sync{font-size:.8rem;color:var(--muted)}
.sync.err{color:var(--late)}
header.top .right{display:flex;align-items:baseline;gap:12px}
.linkbtn{appearance:none;border:0;background:none;padding:0;color:var(--primary);font-size:.85rem;font-weight:600;cursor:pointer}
#login{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px 18px}
#login[hidden],[hidden]{display:none !important}
#login .card{width:min(420px,100%);background:var(--surface);border-radius:18px;padding:22px 18px}
#login h1{font-family:var(--serif);font-weight:400;font-size:1.6rem;margin:0 0 6px;color:var(--primary)}
#login .err{color:var(--late);font-size:.9rem;min-height:1.2em;margin:4px 0 0}
h2{font-family:var(--serif);font-weight:400;font-size:1.35rem;margin:28px 0 10px;line-height:1.2}
h2:first-child{margin-top:0}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:.875rem}

/* Oggi */
.date{font-size:1rem;color:var(--muted);margin:0 0 6px}
.meals{display:grid;gap:4px;margin-bottom:8px}
.meal{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.meal:last-child{border-bottom:0}
.meal .when{display:block;font-size:.9rem;color:var(--muted)}
.meal .dish{display:block;font-family:var(--serif);font-size:clamp(1.7rem,7vw,2.3rem);line-height:1.15;margin-top:2px}
.meal .dish.empty{color:var(--muted);font-size:1.4rem}
.tomorrow{font-size:.95rem;color:var(--muted);margin:6px 0 0}
.tomorrow strong{color:var(--ink);font-weight:500}
.banner{background:var(--primary-soft);border-radius:14px;padding:14px 16px;margin:18px 0 0;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.steps{padding-left:1.3em;margin:0 0 12px}
.steps li{margin-bottom:6px}

/* liste */
.list{list-style:none;margin:0;padding:0}
.item{background:var(--surface);border-radius:12px;padding:12px 14px;margin-bottom:8px;border-left:4px solid transparent}
.item.late{border-left-color:var(--late)}
.item.soon{border-left-color:var(--soon)}
.item.ok{border-left-color:var(--line)}
.item .title{font-weight:600}
.item .meta{font-size:.875rem;color:var(--muted)}
.tag{display:inline-block;font-size:.8rem;font-weight:600;padding:1px 8px;border-radius:999px;margin-top:4px}
.tag.late{background:var(--late-bg);color:var(--late)}
.tag.soon{background:var(--soon-bg);color:var(--soon)}
.tag.ok{background:var(--primary-soft);color:var(--ok)}
.row-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

/* bottoni */
.btn{appearance:none;border:0;background:var(--primary);color:var(--primary-ink);padding:9px 16px;border-radius:999px;font-weight:600;font-size:.95rem;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.ghost{background:transparent;color:var(--primary);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.small{padding:6px 12px;font-size:.85rem}
.btn.danger{background:transparent;color:var(--late);box-shadow:inset 0 0 0 1.5px var(--late-bg)}
.btn:disabled{opacity:.5;cursor:default}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px}

/* menù */
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.weeknav h2{margin:0;font-size:1.2rem;text-align:center;flex:1}
.iconbtn{appearance:none;border:0;background:var(--surface);width:40px;height:40px;border-radius:50%;font-size:1.2rem;cursor:pointer;color:var(--primary)}
.iconbtn:disabled{opacity:.35;cursor:default}
.week{background:var(--surface);border-radius:14px;overflow:hidden}
.day{display:grid;grid-template-columns:98px 1fr 1fr;border-bottom:1px solid var(--line)}
.day:last-child{border-bottom:0}
.day.today{background:var(--primary-soft)}
.day .dname{padding:10px 6px 10px 12px;font-weight:600;font-size:.88rem;line-height:1.25}
.day .dname span{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.slot{appearance:none;border:0;border-left:1px solid var(--line);background:none;text-align:left;padding:8px 10px;cursor:pointer;min-height:56px;font-size:.9rem;line-height:1.3}
.slot small{display:block;color:var(--muted);font-size:.75rem}
.slot .empty{color:var(--muted)}
.dishes{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:14px;overflow:hidden}
.dishes li button{appearance:none;width:100%;text-align:left;border:0;background:none;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.dishes li:last-child button{border-bottom:0}
.dishes .cnt{color:var(--muted);font-size:.85rem;white-space:nowrap}

/* spesa */
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.check:last-child{border-bottom:0}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--primary);flex:none}
.check .from{display:block;font-size:.8rem;color:var(--muted)}
.check.done .name{text-decoration:line-through;color:var(--muted)}
.orari{background:var(--surface);border-radius:12px;padding:10px 14px;margin:12px 0 0;font-size:.95rem}
.orari strong{font-weight:600}
.orday{appearance:none;width:100%;display:flex;justify-content:space-between;align-items:baseline;gap:10px;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 14px;cursor:pointer;font-size:.95rem}
.orday:last-child{border-bottom:0}
.orday.today{background:var(--primary-soft)}
.orday .dn{font-weight:600;white-space:nowrap}
.orday .dn span{font-weight:400;color:var(--muted);font-size:.85rem}
.facbtn{appearance:none;border:0;background:none;padding:0;text-align:left;flex:1;min-width:0;cursor:pointer;color:inherit}
.box{background:var(--surface);border-radius:14px;overflow:hidden}
.addrow{display:flex;gap:8px;margin:10px 0}
.addrow input{flex:1;min-width:0}

/* form */
input[type=text],input[type=search],input[type=date],input[type=time],input[type=number],select,textarea{
  width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;font-size:16px}
textarea{min-height:110px;resize:vertical}
label.f{display:block;margin:0 0 12px;font-size:.9rem;color:var(--muted)}
label.f > input,label.f > select,label.f > textarea{margin-top:4px;color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

dialog{border:0;padding:0;border-radius:18px;background:var(--surface);color:var(--ink);width:min(520px,calc(100vw - 24px));max-height:calc(100% - 40px)}
dialog::backdrop{background:rgba(10,20,18,.45)}
.dlg{padding:20px 18px 18px}
.dlg h2{margin:0 0 14px}
.dlg-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:14px}
.dlg-actions .spacer{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{appearance:none;border:0;background:var(--primary-soft);color:var(--ink);padding:5px 12px;border-radius:999px;font-size:.85rem;cursor:pointer}
.chip input{accent-color:var(--primary);margin:0 4px 0 0;vertical-align:-2px}
.vrow{display:flex;gap:12px;align-items:flex-start;padding:10px 14px 10px 10px;border-bottom:1px solid var(--line);border-left:4px solid transparent}
.vrow:last-child{border-bottom:0}
.vrow.late{border-left-color:var(--late)}
.vrow.soon{border-left-color:var(--soon)}
.vrow input{width:20px;height:20px;margin-top:2px;accent-color:var(--primary);flex:none}
.vdot{width:20px;flex:none;text-align:center;color:var(--muted);line-height:1.5}
.vtxt{appearance:none;background:none;border:0;padding:0;text-align:left;color:inherit;font:inherit;cursor:pointer;flex:1;min-width:0}
.vtxt .t{display:block;font-weight:600}
.vtxt .m{display:block;font-size:.85rem;color:var(--muted)}
.vrow.done .t{text-decoration:line-through;color:var(--muted)}
.arow{appearance:none;width:100%;display:grid;grid-template-columns:76px 1fr;gap:10px;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 14px;cursor:pointer;color:inherit;font-size:.95rem}
.arow:last-child{border-bottom:0}
.arow .q{color:var(--muted);font-size:.85rem;line-height:1.3}
.arow .q b{display:block;color:var(--ink);font-weight:600;font-size:.9rem}
.arow .t{font-weight:500}
.arow .m{display:block;color:var(--muted);font-size:.82rem}
.pick{list-style:none;margin:6px 0 0;padding:0;max-height:42vh;overflow:auto;border-top:1px solid var(--line)}
.pick li button{appearance:none;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 4px;cursor:pointer}
.pick li button.cur{font-weight:600;color:var(--primary)}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 10px;color:var(--muted);text-decoration:none;font-size:.7rem;font-weight:500}
nav.tabs a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a[aria-current="page"]{color:var(--primary)}
nav.tabs a .dot{width:6px;height:6px;border-radius:50%;background:var(--late);position:absolute;margin-left:16px;margin-top:-2px}
nav.tabs a .ic{position:relative;display:flex}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
.readonly .needs-write{display:none !important}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Casa</h1>
    <div class="right"><span class="sync" id="sync">Caricamento…</span><button type="button" class="linkbtn" id="account" hidden>Account</button></div>
  </header>
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="Sezioni">
  <div class="in">
    <a href="#oggi" data-tab="oggi"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>Oggi</a>
    <a href="#menu" data-tab="menu"><span class="ic"><svg viewBox="0 0 24 24"><path d="M7 3v8a2 2 0 0 0 2 2v8M11 3v6M3 3v6a4 4 0 0 0 4 4M17 21V3c2.5 1 4 4 4 8h-4"/></svg></span>Menù</a>
    <a href="#spesa" data-tab="spesa"><span class="ic"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 1.9-1.5L21 8H6"/><circle cx="10" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg></span>Spesa</a>
    <a href="#casa" data-tab="casa"><span class="ic"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/></svg></span>Casa</a>
    <a href="#orari" data-tab="orari"><span class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/></svg></span>Orari</a>
    <a href="#agenda" data-tab="agenda"><span class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span class="dot" id="dotAg" hidden></span></span>Agenda</a>
  </div>
</nav>

<div id="login" hidden>
  <form class="card" id="loginForm" novalidate>
    <h1>Casa</h1>
    <p class="muted small">Accedi per ritrovare menù, spesa e faccende su tutti i tuoi dispositivi.</p>
    <label class="f">Email<input type="email" id="lEmail" autocomplete="username" required style="width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;font-size:16px;margin-top:4px;color:var(--ink)"></label>
    <label class="f">Password<input type="password" id="lPass" autocomplete="current-password" required minlength="6" style="width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;font-size:16px;margin-top:4px;color:var(--ink)"></label>
    <div class="bar"><button class="btn" type="submit" id="lIn">Accedi</button><button class="btn ghost" type="button" id="lNew">Crea account</button></div>
    <button class="linkbtn" type="button" id="lReset">Password dimenticata?</button>
    <p class="err" id="lErr" role="alert"></p>
  </form>
</div>

<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- utilità ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = String(s).split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const addMonths = (d, n) => { const day = d.getDate(); const x = new Date(d.getFullYear(), d.getMonth()+n, 1); const last = new Date(x.getFullYear(), x.getMonth()+1, 0).getDate(); x.setDate(Math.min(day, last)); return x; };
const today = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const monday = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay()+6)%7)); return x; };
const diffDays = (a, b) => Math.round((a - b) / 86400000);
const fmt = (d, o) => d.toLocaleDateString('it-IT', o);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const GIORNI = ['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'];
const dayIdx = d => (d.getDay()+6)%7;

/* ---------- stato ---------- */
const EMPTY = () => ({ piatti: [], piani: {}, spesaExtra: [], spesaSpunte: {}, agenda: [], faccende: [], orari: {} });
// vecchio formato: scadenze, impegni, avvisi della sera prima (e prima ancora divieti di sosta) e da fare erano liste separate
function migraAgenda(o){
  const A = [];
  for (const x of o.todo || []) A.push({ id: x.id || uid(), titolo: x.t, fatto: !!x.f });
  for (const i of o.impegni || []) A.push({ id: i.id || uid(), titolo: i.titolo, data: i.data, ora: i.ora || '', note: [i.chi, i.note].filter(Boolean).join(' · '), avvisi: i.avvisi || [], muto: i.muto ? i.data : '' });
  for (const x of o.scadenze || []){
    const pre = Number(x.preavviso) || 0;
    A.push({ id: x.id || uid(), titolo: x.nome, data: x.data, ripeti: Number(x.ricorrenza) ? String(x.ricorrenza) : '', note: x.note || '', avvisi: [0, ...(pre ? [pre <= 1 ? 1440 : pre <= 10 ? 10080 : 43200] : [])] });
  }
  let ser = o.serali;
  if (!Array.isArray(ser) || !ser.length) ser = (o.divieti || []).map(r => ({ id: r.id, titolo: `Sposta la macchina da ${r.via}`, giorni: [Number(r.giorno)], parita: r.ord, ora: '22:30' }));
  for (const r of ser) A.push({ id: r.id || uid(), titolo: r.titolo, ripeti: 'sett', giorni: (r.giorni || []).map(Number), parita: r.parita || '', sera: r.ora || '21:30', note: r.nota || '' });
  return A;
}
function norm(o){
  const e = EMPTY(); o = (o && typeof o === 'object') ? o : {};
  for (const k in e) if (o[k] !== undefined && Array.isArray(o[k]) === Array.isArray(e[k]) && typeof o[k] === 'object' && o[k] !== null) e[k] = o[k];
  if (!Array.isArray(o.agenda)) e.agenda = migraAgenda(o);
  e.agenda = e.agenda.map(v => ({ id: uid(), titolo: '', note: '', data: '', ora: '', ripeti: '', giorni: [], parita: '', avvisi: [], sera: '', muto: '', fatto: false, ...v }));
  for (const p of e.piatti) if (Array.isArray(p.ingredienti)) p.ingredienti = [...new Set(p.ingredienti.map(sing))];
  return e;
}
// gli ingredienti si tengono al singolare, così nella spesa non compaiono due volte (carota e carote)
const SINGOLARE = { 'carote':'carota', 'patate':'patata', 'zucchine':'zucchina', 'uova':'uovo', 'pomodorini':'pomodorino', 'cosce di pollo':'coscia di pollo', 'fettine di tacchino':'fettina di tacchino', 'filetti di merluzzo':'filetto di merluzzo', 'cipolle':'cipolla', 'melanzane':'melanzana', 'peperoni':'peperone', 'pomodori':'pomodoro', 'mele':'mela', 'pere':'pera', 'banane':'banana', 'limoni':'limone', 'arance':'arancia', 'salsicce':'salsiccia', 'scaloppine':'scaloppina', 'fettine di pollo':'fettina di pollo', 'fettine di vitello':'fettina di vitello', 'filetti di platessa':'filetto di platessa', 'filetti di salmone':'filetto di salmone', 'sottilette':'sottiletta', 'finocchi':'finocchio', 'porri':'porro', 'funghi':'fungo', 'cetrioli':'cetriolo', 'cotolette':'cotoletta', 'polpette':'polpetta' };
function sing(x){ const t = String(x).trim(); return SINGOLARE[t.toLowerCase()] || t; }
const LS = 'casa-organizer-v1';
let S = EMPTY();
try { const r = localStorage.getItem(LS); if (r) S = norm(JSON.parse(r)); } catch (e) {}
const hasContent = s => s.piatti.length || s.agenda.length || Object.keys(s.orari).length || s.faccende.length || Object.keys(s.piani).length;

/* ---------- salvataggio e sincronizzazione ---------- */
let ref = null, timer = null, saving = false, again = false, readOnly = false, loaded = false;
function setStatus(k){
  const el = $('#sync');
  const t = { ok:'Sincronizzato', saving:'Salvataggio…', local:'Salvato su questo dispositivo', ro:'Solo lettura', err:'Non salvato, riprova più tardi' }[k] || '';
  el.textContent = t; el.classList.toggle('err', k === 'err');
  document.body.classList.toggle('readonly', k === 'ro');
}
function commit(){
  pruneOld();
  try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {}
  render();
  // finché non so cosa c'è nel cloud non scrivo niente, per non coprire i dati salvati da un altro dispositivo
  if (ref && !readOnly && loaded){ clearTimeout(timer); timer = setTimeout(flush, 600); setStatus('saving'); }
}
async function flush(){
  timer = null;
  if (saving){ again = true; return; }
  saving = true;
  try { await ref.set(JSON.parse(JSON.stringify(S))); setStatus('ok'); }
  catch (e){
    setStatus('err');
  } finally {
    saving = false;
    if (again){ again = false; flush(); }
  }
}
function pruneOld(){
  const limit = iso(addDays(monday(today()), -28));
  for (const k of Object.keys(S.piani)) if (k < limit) delete S.piani[k];
  for (const k of Object.keys(S.spesaSpunte)) if (k < limit) delete S.spesaSpunte[k];
  for (const k of Object.keys(S.orari)) if (k < limit) delete S.orari[k];
}
// cloud.js collega qui il documento dell'utente dopo l'accesso: { set(obj), onSnapshot(next, err) }
let unsub = null;
function attachCloud(r){
  detachCloud(); ref = r; readOnly = false; loaded = false;
  setStatus('saving');
  unsub = ref.onSnapshot(snap => {
    // "non esiste" dalla sola cache del telefono non vuol dire niente: aspetto la risposta del server
    if (!snap.exists && snap.fromCache) return;
    const first = !loaded; loaded = true;
    if (!first && (timer || saving)) return;
    if (snap.exists){
      S = norm(JSON.parse(JSON.stringify(snap.data())));
      try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {}
      render(); setStatus('ok'); checkSilenzia();
    } else if (first && hasContent(S)){
      flush(); // primo accesso: porto nel cloud i dati che c'erano sul dispositivo
    } else setStatus('ok');
  }, () => setStatus('err'));
}
// toccando una notifica si arriva con ?silenzia=<id>&il=<data>: chiedo se fermare gli altri avvisi per quella volta
function checkSilenzia(){
  const q = new URLSearchParams(location.search), id = q.get('silenzia'), il = q.get('il'); if (!id || !il) return;
  const v = S.agenda.find(x => x.id === id); if (!v) return; // forse i dati non sono ancora arrivati
  history.replaceState(null, '', location.pathname + location.hash);
  if (v.muto === il) return;
  ask(`Silenziare i prossimi avvisi per “${v.titolo}”?`, 'Silenzia').then(ok => {
    const x = ok && S.agenda.find(y => y.id === id);
    if (x){ x.muto = il; commit(); toast('Avvisi silenziati'); }
  });
}
function detachCloud(){ if (unsub) unsub(); unsub = null; ref = null; loaded = false; clearTimeout(timer); timer = null; setStatus('local'); }
function importa(o){ S = norm(o); if (ref) loaded = true; commit(); }
setStatus('local');

let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2800); }
const dlg = $('#dlg');
function openDlg(html, mount){ dlg.innerHTML = `<div class="dlg">${html}</div>`; dlg.showModal(); if (mount) mount(dlg); }
function closeDlg(){ if (dlg.open) dlg.close(); }
dlg.addEventListener('click', e => { if (e.target === dlg) closeDlg(); });
function ask(msg, yes = 'Conferma'){
  return new Promise(res => openDlg(`<p>${esc(msg)}</p><div class="dlg-actions"><button type="button" class="btn ghost" id="no">Annulla</button><button type="button" class="btn" id="yes">${esc(yes)}</button></div>`, d => {
    d.querySelector('#no').addEventListener('click', () => { closeDlg(); res(false); });

const tipoDi = p => p.tipo || (/^(pizza|piadin)/i.test(p.nome) ? 'unico' : /^(pasta|pastina|risott|riso|minestr|vellutat|tortellini|zupp|crema|gnocchi)/i.test(p.nome) ? 'primo' : 'secondo');
const tipoLabel = p => TIPI.find(t => t[0] === tipoDi(p))[1];

function mealFor(date, which){
  const wk = iso(monday(date)); const key = `${dayIdx(date)}-${which}`;
  return (S.piani[wk] || {})[key];
}
function listaSpesa(wk){
  const plan = S.piani[wk] || {}; const m = new Map();
  for (const v of Object.values(plan)){
    if (!v || !v.id) continue; const p = piatto(v.id); if (!p) continue;
    for (const ing of p.ingredienti || []){
      const nome = sing(ing); const k = nome.toLowerCase(); if (!k) continue;
      const e = m.get(k) || { k, nome, piatti: [] };
      if (!e.piatti.includes(p.nome)) e.piatti.push(p.nome);
      m.set(k, e);
    }
  }
  return [...m.values()].sort((a,b) => a.k.localeCompare(b.k, 'it'));
}

/* ---------- agenda: tutto quello che c'è da fare ---------- */
// voce: { id, titolo, note, data, ora, ripeti, giorni, parita, avvisi, sera, muto, fatto }
// ripeti '' = una volta (senza data è un semplice "da fare"); 'sett' = ogni settimana nei giorni scelti, anche solo con
// data pari o dispari; '1','3','6','12','24' = ogni tanti mesi, e la data è la prossima volta (avanza quando la segni fatta).
// avvisi: minuti prima (senza ora si conta dalle 9); sera: avviso la sera prima a quell'ora; muto: la volta silenziata.
const IS_APP = true;
const RIPETI = [['','Mai'],['sett','Ogni settimana'],['1','Ogni mese'],['3','Ogni 3 mesi'],['6','Ogni 6 mesi'],['12','Ogni anno'],['24','Ogni 2 anni']];
const AVVISI = [[0,'All’ora'],[30,'30 minuti'],[60,'1 ora'],[120,'2 ore'],[1440,'1 giorno'],[10080,'1 settimana'],[43200,'1 mese']];
const PARITA = { '': '', pari: ', solo date pari', dispari: ', solo date dispari' };
const elenco = a => a.length > 1 ? a.slice(0, -1).join(', ') + ' e ' + a[a.length - 1] : (a[0] || '');
const settIl = (v, d) => (v.giorni || []).includes(dayIdx(d)) && (!v.parita || (d.getDate() % 2 === 0) === (v.parita === 'pari'));
const mesi = v => v.ripeti && v.ripeti !== 'sett' ? Number(v.ripeti) : 0;
const perData = (a, b) => (a.data + a.ora).localeCompare(b.data + b.ora);
const inRitardo = v => !v.fatto && v.ripeti !== 'sett' && v.data && v.data < iso(today());
const daFare = () => S.agenda.filter(v => !v.data && v.ripeti !== 'sett' && !v.fatto);
const ripetiTxt = v => v.ripeti === 'sett' ? 'Ogni ' + elenco([...v.giorni].sort((a,b) => a - b).map(i => GIORNI[i].toLowerCase())) + PARITA[v.parita || ''] : mesi(v) ? RIPETI.find(r => r[0] === v.ripeti)[1] : '';
function avvisiTxt(v){
  const a = AVVISI.filter(([m]) => v.avvisi.includes(m)).map(([m, t]) => m ? t + ' prima' : 'all’ora');
  if (v.sera) a.unshift(`la sera prima alle ${v.sera}`);
  return a.length ? 'Avviso ' + elenco(a) : '';
}
// le volte in cui una voce capita tra due giorni (compresi)
function occorrenze(v, da, a){
  if (v.ripeti === 'sett'){ const out = []; for (let d = parse(da); iso(d) <= a; d = addDays(d, 1)) if (settIl(v, d)) out.push(iso(d)); return out; }
  return v.data && !v.fatto && v.data >= da && v.data <= a ? [v.data] : [];
}
// quando va fatta: per gli avvisi della sera prima senza ora è la sera prima
const momento = (v, d) => v.sera && !v.ora ? [iso(addDays(parse(d), -1)), v.sera] : [d, v.ora || ''];
function quandoTxt(v, d){
  const [g, o] = momento(v, d), dd = diffDays(parse(g), today());
  if (v.sera && !v.ora) return (dd === 0 ? 'Stasera' : dd === 1 ? 'Domani sera' : cap(fmt(parse(g), {weekday:'long', day:'numeric'})) + ' sera') + ' alle ' + o;
  return (dd === 0 ? 'Oggi' : dd === 1 ? 'Domani' : dd === -1 ? 'Ieri' : cap(fmt(parse(g), {weekday:'long', day:'numeric', month:'long'}))) + (o ? ' alle ' + o : '');
}
function prossimi(t, n){
  const da = iso(t), a = iso(addDays(t, n - 1)), ev = [];
  for (const v of S.agenda) for (const d of occorrenze(v, da, iso(addDays(t, n)))){ const [g] = momento(v, d); if (g >= da && g <= a) ev.push([d, v]); }
  return ev.sort(([a, x], [b, y]) => momento(x, a).join(' ').localeCompare(momento(y, b).join(' ')));
}
const stasera = () => { const tm = iso(addDays(today(), 1)); return S.agenda.filter(v => v.sera && v.muto !== tm && occorrenze(v, tm, tm).length).sort((a,b) => a.sera.localeCompare(b.sera)); };
// d: la volta mostrata ('' negli elenchi delle ricorrenze)
function voceRow(v, d){
  const meta = [d ? quandoTxt(v, d) : '', v.ripeti === 'sett' && d ? '' : ripetiTxt(v), d ? '' : avvisiTxt(v), v.note].filter(Boolean).join(' · ');
  const st = inRitardo(v) ? 'late' : d && diffDays(parse(momento(v, d)[0]), today()) <= 1 ? 'soon' : '';
  return `<div class="vrow ${st} ${v.fatto ? 'done' : ''}">${v.ripeti === 'sett' ? '<span class="vdot" aria-hidden="true">↻</span>'
      : `<input type="checkbox" class="needs-write" data-act="tickVoce" data-id="${v.id}" ${v.fatto ? 'checked' : ''} aria-label="Fatto">`}
    <button class="vtxt" data-act="voce" data-id="${v.id}"><span class="t">${esc(v.titolo)}</span>${meta ? `<span class="m">${esc(meta)}</span>` : ''}${d && v.muto === d ? '<span class="m">Avvisi silenziati</span>' : ''}</button></div>`;
}
const box = (rows) => `<div class="box">${rows.join('')}</div>`;

/* ---------- faccende di casa ---------- */
const FREQ = [[1,'Ogni giorno'],[2,'Ogni 2 giorni'],[3,'Ogni 3 giorni'],[7,'Ogni settimana'],[14,'Ogni 2 settimane'],[30,'Ogni mese']];
const freqLabel = n => (FREQ.find(f => f[0] === Number(n)) || [0, `Ogni ${n} giorni`])[1];
function facStato(f){
  if (!f.ultima) return { due: true, done: false, d: 0, txt: 'Da fare' };
  const d = diffDays(addDays(parse(f.ultima), Number(f.ogni) || 1), today());
  if (f.ultima === iso(today())) return { due: false, done: true, d, txt: 'Fatta oggi' };
  if (d < 0) return { due: true, done: false, d, txt: `Da fare, in ritardo di ${-d} ${-d === 1 ? 'giorno' : 'giorni'}` };
  if (d === 0) return { due: true, done: false, d, txt: 'Da fare oggi' };
  return { due: false, done: false, d, txt: d === 1 ? 'Domani' : `Tra ${d} giorni` };
}

function vAgenda(){
  const t = today(), fino = iso(addDays(t, 6));
  let h = `<div class="bar needs-write" style="margin-top:14px"><button class="btn" data-act="voce">Aggiungi</button>${IS_APP ? '<button class="btn small ghost" data-act="notifiche">Attiva le notifiche qui</button>' : ''}</div>
    <p class="muted small">Con data e ora è un impegno, se si ripete una ricorrenza, senza data una cosa da fare.</p>`;
  const late = S.agenda.filter(inRitardo).sort(perData);
  if (late.length) h += `<h2>In ritardo</h2>` + box(late.map(v => voceRow(v, v.data)));
  const ev = prossimi(t, 7);
  h += `<h2>Prossimi 7 giorni</h2>` + (ev.length ? box(ev.map(([d, v]) => voceRow(v, d))) : `<p class="muted">Niente in programma.</p>`);
  const todo = daFare();
  h += `<h2>Da fare</h2>` + (todo.length ? box(todo.map(v => voceRow(v, ''))) : `<p class="muted">Niente da fare. Beati voi.</p>`);
  const dopo = S.agenda.filter(v => !v.fatto && v.ripeti !== 'sett' && v.data > fino).sort(perData);
  if (dopo.length) h += `<h2>Più avanti</h2>` + box(dopo.map(v => voceRow(v, v.data)));
  const sett = S.agenda.filter(v => v.ripeti === 'sett');
  if (sett.length) h += `<h2>Ogni settimana</h2>` + box(sett.map(v => voceRow(v, '')));
  const fatti = S.agenda.filter(v => v.fatto);
  if (fatti.length){
    h += `<div class="bar"><button class="btn small ghost" data-act="past">${showPast ? 'Nascondi' : 'Mostra'} le cose fatte (${fatti.length})</button>
      ${showPast ? '<button class="btn small danger needs-write" data-act="clearFatti">Elimina le cose fatte</button>' : ''}</div>`;
    if (showPast) h += box(fatti.map(v => voceRow(v, '')));
  }
  return h;
}

/* ---------- azioni ---------- */
function autofill(){
  if (!S.piatti.length){ toast('Prima aggiungi qualche piatto'); return; }
  const wk = wkKey(wOff); const plan = S.piani[wk] = S.piani[wk] || {};
  const used = new Set(Object.values(plan).filter(v => v && v.id).map(v => v.id));
  const shuffle = a => { for (let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };
  // primi a pranzo, secondi a cena; il piatto unico va bene per entrambi
  const fits = (p, w) => { const t = tipoDi(p); return t === 'unico' || t === (w === 'p' ? 'primo' : 'secondo'); };
  const draw = w => {
    let c = S.piatti.filter(p => fits(p, w) && !used.has(p.id));
    if (!c.length) c = S.piatti.filter(p => fits(p, w));
    if (!c.length) c = S.piatti.filter(p => !used.has(p.id));
    if (!c.length) c = S.piatti;
    const id = shuffle([...c])[0].id; used.add(id); return id;
  };
  let n = 0;
  for (let i = 0; i < 7; i++) for (const w of ['p','c']){
    const k = `${i}-${w}`;
    if (wOff === 0 && i < dayIdx(today())) continue;
    if (plan[k]) continue;
    plan[k] = { id: draw(w) }; n++;
  }
  commit(); toast(n ? `${n} pasti aggiunti: tocca un pasto per cambiarlo` : 'La settimana è già piena');
}

  const testo = `Spesa:\n${righe.map(r => '- ' + r).join('\n')}`;
  try { await navigator.clipboard.writeText(testo); toast('Lista copiata: incollala dove vuoi'); }

    openDlg(`<h2>Copia la lista</h2><p class="muted small">Seleziona il testo e copialo.</p><textarea id="tx" readonly style="min-height:220px">${esc(testo)}</textarea>
      <div class="dlg-actions"><button type="button" class="btn" id="cls">Fatto</button></div>`, d => {

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.closest('dialog')) return;
  const a = b.dataset.act;
  switch (a){
    case 'slot': if (readOnly) return; slotDlg(b.dataset.wk, b.dataset.key, b.dataset.label); break;
    case 'wk': wOff = Math.max(-1, Math.min(2, wOff + Number(b.dataset.d))); render(); break;
    case 'planNext': wOff = 1; location.hash = 'menu'; break;
    case 'autofill': autofill(); break;
    case 'clearWeek': { const wk = wkKey(wOff); ask('Svuotare tutti i pasti di questa settimana?', 'Svuota').then(ok => { if (ok){ delete S.piani[wk]; commit(); toast('Settimana svuotata'); } }); break; }
    case 'seed': seed(); break;
    case 'dish': dishDlg(b.dataset.id); break;
    case 'copy': copyList(); break;
    case 'addExtra': addExtra(); break;
    case 'clearExtra': S.spesaExtra = S.spesaExtra.filter(x => !x.f); commit(); break;
    case 'fac': facDlg(b.dataset.id); break;
    case 'turno': turnoDlg(b.dataset.wk, b.dataset.i); break;
    case 'copiaOrari': copiaOrari(); break;
    case 'svuotaOrari': { const wk = wkKey(wOff); ask('Togliere tutti gli orari di questa settimana?', 'Svuota').then(ok => { if (ok){ delete S.orari[wk]; commit(); } }); break; }
    case 'notifiche': if (window.casaCloud) window.casaCloud.attivaNotifiche(); else toast('Accedi per attivare le notifiche'); break;
    case 'voce': if (readOnly) return; voceDlg(b.dataset.id); break;
    case 'past': showPast = !showPast; render(); break;
    case 'clearFatti': ask('Eliminare tutte le cose fatte?', 'Elimina').then(ok => { if (ok){ S.agenda = S.agenda.filter(v => !v.fatto); commit(); } }); break;
  }
});
document.addEventListener('change', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  if (readOnly){ render(); return; }
  if (b.dataset.act === 'tick'){
    const wk = b.dataset.wk, k = b.dataset.k; S.spesaSpunte[wk] = S.spesaSpunte[wk] || {};
    if (b.checked) S.spesaSpunte[wk][k] = true; else delete S.spesaSpunte[wk][k];
    commit();
  } else if (b.dataset.act === 'tickVoce'){
    const v = S.agenda.find(x => x.id === b.dataset.id); if (!v) return;
    const n = mesi(v);
    if (n && b.checked){ // le ricorrenze mensili o annuali passano alla volta dopo
      let d = addMonths(parse(v.data), n); while (d < today()) d = addMonths(d, n);
      v.data = iso(d); v.muto = ''; toast(`Fatta. Prossima: ${fmt(d,{day:'numeric', month:'long', year:'numeric'})}`);
    } else v.fatto = b.checked;
    commit();
  } else if (b.dataset.act === 'tickExtra'){
    const x = S.spesaExtra.find(x => x.id === b.dataset.id); if (x){ x.f = b.checked; commit(); }
  } else if (b.dataset.act === 'tickFac'){
    const f = S.faccende.find(x => x.id === b.dataset.id); if (!f) return;
    if (b.checked){ f.prima = f.ultima || ''; f.ultima = iso(today()); } else { f.ultima = f.prima || ''; delete f.prima; }
    commit();
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'extraIn'){ e.preventDefault(); addExtra(); } });

route(); checkSilenzia();
window.casaApp = { attachCloud, detachCloud, importa, getState: () => S, openDlg, closeDlg, toast, ask, setStatus };
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
<script src="firebase-config.js"></script>
<script type="module" src="cloud.js"></script>
</body>
